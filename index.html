    <script>
      // Gracefully prevent benign Vite HMR WebSocket connection closed logs from bubbling as app errors
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('vite'))) {
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (String(e.reason).includes('WebSocket') || String(e.reason).includes('vite'))) {
          e.stopImmediatePropagation();
        }
      });
    </script>
